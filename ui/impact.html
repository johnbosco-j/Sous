<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sous · Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16100d;--bg2:#1f1712;--card:#2a1f19;--card2:#33261e;--line:rgba(255,236,214,.10);--line2:rgba(255,236,214,.18);
  --text:#fff6ec;--muted:#cdb9a8;--dim:#93806f;
  --saffron:#f6a72a;--tomato:#ef563c;--basil:#5fca81;--cyan:#27d4f7;--plum:#b07cff;
  --urgent:#ff5d4f;--soon:#ffb547;--fresh:#62d48f;--expired:#8a7a70;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden}
body{color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 88% -12%,rgba(246,167,42,.17),transparent 62%),
             radial-gradient(800px 480px at -8% 112%,rgba(239,86,60,.15),transparent 60%),var(--bg)}
button{font-family:inherit}
.eyebrow{font:800 15px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--saffron)}
.h1{font-family:var(--serif);font-weight:600;font-size:54px;line-height:1.02;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.h1 em{font-style:italic;color:var(--saffron)}
.sub{font-size:21px;color:var(--muted);line-height:1.35}
.btn{appearance:none;border:0;border-radius:999px;padding:17px 28px;font:800 21px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  transition:transform .15s ease,filter .15s ease,background .2s ease,opacity .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--saffron),var(--tomato));color:#1d0f07;box-shadow:0 12px 30px -12px rgba(239,86,60,.8)}
.btn-ghost{background:rgba(255,246,236,.07);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn-sm{padding:13px 20px;font-size:18px}
.btn.loading{opacity:.6;pointer-events:none}
.btn.loading::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;font:700 16px/1 var(--sans);background:rgba(255,246,236,.07);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.u-urgent{color:var(--urgent)}.u-soon{color:var(--soon)}.u-fresh{color:var(--fresh)}.u-expired{color:var(--expired)}
.bg-urgent{background:var(--urgent)}.bg-soon{background:var(--soon)}.bg-fresh{background:var(--fresh)}.bg-expired{background:var(--expired)}
.voicehint{font:600 17px/1 var(--sans);color:var(--dim)}
.voicehint b{color:var(--cyan);font-weight:800}
.wait{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font:600 20px var(--sans)}
.wait i{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--saffron);animation:bob 1s ease-in-out infinite}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
.err{position:fixed;left:24px;right:24px;bottom:24px;padding:14px 18px;border-radius:14px;background:rgba(239,86,60,.16);color:#ffd0c6;font:600 16px var(--sans);box-shadow:inset 0 0 0 1px rgba(239,86,60,.4)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,93,79,.0)}50%{box-shadow:0 0 0 6px rgba(255,93,79,.18)}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
<style>
.wrap{position:absolute;inset:0;padding:32px 44px 22px;display:grid;grid-template-rows:auto auto 1fr;gap:18px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.big{font-family:var(--serif);font-weight:600;font-size:92px;line-height:.92;letter-spacing:-.03em;margin-top:14px}
.big em{color:var(--basil);font-style:normal}
.big small{display:block;font-size:34px;font-style:italic;color:var(--muted);letter-spacing:-.01em;margin-top:10px}
.proj{max-width:330px;padding:20px 22px;border-radius:24px;background:rgba(95,202,129,.10);box-shadow:inset 0 0 0 1px rgba(95,202,129,.32);font:700 18px/1.4 var(--sans);color:#cdf3d9}
.proj b{display:block;font-family:var(--serif);font-size:44px;line-height:1.05;color:var(--text);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{padding:18px 22px;border-radius:24px;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:16px}
.stat .i{font-size:34px}
.stat b{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1}
.stat span{display:block;margin-top:6px;font:700 15px var(--sans);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.lower{min-height:0;display:grid;grid-template-columns:1fr 360px;gap:20px}
.panel{min-height:0;padding:20px 24px;border-radius:28px;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column}
.panel h3{font:800 15px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
svg.chart{flex:1;min-height:0;width:100%}
.chart .lbl{font:700 15px var(--sans);fill:var(--dim)}
.chart .val{font:800 16px var(--sans);fill:var(--text)}
.chart .bar{fill:rgba(246,167,42,.75)}
.chart .bar.today{fill:var(--basil)}
.chart .zero{fill:rgba(255,246,236,.10)}
.items{list-style:none;overflow:auto;scrollbar-width:none}
.items li{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font:700 19px var(--sans)}
.items li:last-child{border-bottom:0}
.items small{display:block;font:600 14px var(--sans);color:var(--dim);margin-top:3px}
.items b{color:var(--basil);font-family:var(--serif);font-size:22px}
</style></head>
<body>
<div class="wait">Adding it up <i></i><i></i><i></i></div>
<main class="wrap" id="app" hidden>
  <header class="hero rise">
    <div><div class="eyebrow">Food rescued with Sous · this week</div>
      <div class="big"><em id="usd">$0.00</em><small>kept out of the bin</small></div></div>
    <div class="proj" id="proj"></div>
  </header>
  <section class="stats rise" style="animation-delay:100ms">
    <div class="stat"><div class="i">🥬</div><div><b id="kg"></b><span>Food rescued</span></div></div>
    <div class="stat"><div class="i">🌍</div><div><b id="co2"></b><span>CO₂e avoided</span></div></div>
    <div class="stat"><div class="i">🍽️</div><div><b id="meals"></b><span>Meals cooked</span></div></div>
  </section>
  <section class="lower rise" style="animation-delay:200ms">
    <div class="panel"><h3>Rescued per day</h3><svg class="chart" id="chart" viewBox="0 0 700 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Dollars of food rescued per day"></svg></div>
    <div class="panel"><h3>Recently rescued</h3><ul class="items" id="items"></ul></div>
  </section>
</main>
<script>window.__SOUS_SAMPLE__={"content":[{"type":"text","text":"Impact."}],"structuredContent":{"ok":true,"tool":"impact_report","speech":"Impact.","view":"impact","data":{"rescuedUsd":23.4,"rescuedKg":4.1,"co2eKg":10.2,"mealsCooked":5,"projectionYearUsd":1216,"itemsRescued":[{"name":"Spinach","valueUsd":3.49,"date":"2026-10-23"},{"name":"Tomatoes","valueUsd":2.8,"date":"2026-10-23"},{"name":"Cooked rice","valueUsd":1.5,"date":"2026-10-23"},{"name":"Chicken thighs","valueUsd":6.99,"date":"2026-10-21"},{"name":"Ripe bananas","valueUsd":1.2,"date":"2026-10-20"}],"week":[{"day":"Sat","usd":2.1},{"day":"Sun","usd":0},{"day":"Mon","usd":4.5},{"day":"Tue","usd":3.2},{"day":"Wed","usd":0},{"day":"Thu","usd":5.81},{"day":"Fri","usd":7.79}]}}};</script>

<script>
function countUp(el, to, fmt) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
  var t0 = performance.now(), dur = 1100;
  (function tick(t) { var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(tick); })(t0);

Sous.onResult(function (r) {
  var d = Sous.data(r);
  countUp(document.getElementById('usd'), d.rescuedUsd || 0, Sous.money);
  document.getElementById('kg').textContent = (d.rescuedKg || 0).toFixed(1) + ' kg';
  document.getElementById('co2').textContent = (d.co2eKg || 0).toFixed(1) + ' kg';
  document.getElementById('meals').textContent = d.mealsCooked || 0;
  document.getElementById('proj').innerHTML = '<b>' + '$' + Math.round(d.projectionYearUsd || 0).toLocaleString('en-US') + '</b>a year at this pace, for one household.';
  var week = d.week || [], W = 700, H = 250, top = 30, base = 212, n = Math.max(week.length, 1), slot = W / n, bw = Math.min(64, slot * .56);
  var max = Math.max.apply(null, week.map(function (w) { return w.usd || 0; }).concat([1]));
  document.getElementById('chart').innerHTML = week.map(function (w, i) {
    var v = w.usd || 0, h = v > 0 ? Math.max(6, (base - top) * v / max) : 4, x = i * slot + (slot - bw) / 2, y = base - h, today = i === week.length - 1;
    return '<rect class="' + (v > 0 ? 'bar' + (today ? ' today' : '') : 'zero') + '" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="10"><title>' + Sous.esc(w.day) + ': ' + Sous.money(v) + '</title></rect>' +
      (v > 0 ? '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 9) + '" text-anchor="middle">' + Sous.money(v).replace(/\.00$/, '') + '</text>' : '') +
      '<text class="lbl" x="' + (x + bw / 2) + '" y="' + (base + 28) + '" text-anchor="middle">' + Sous.esc(w.day) + '</text>';
  }).join('');
  document.getElementById('items').innerHTML = (d.itemsRescued || []).slice(0, 8).map(function (x) {
    var dt = x.date ? new Date(x.date + 'T12:00:00') : null;
    return '<li><div>' + Sous.esc(x.name) + (dt && !isNaN(dt) ? '<small>' + dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '</small>' : '') + '</div><b>' + Sous.money(x.valueUsd) + '</b></li>';
  }).join('') || '<li style="color:var(--dim)">Cook a use-it-up meal to start your tally.</li>';
