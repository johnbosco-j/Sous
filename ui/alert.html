<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sous · Allergy alert</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:#2a0b08}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 360px;gap:34px;padding:40px 48px}
.emergency{background:radial-gradient(900px 600px at 20% 0%,#ff4b3a 0%,#c4180d 45%,#7a0a05 100%)}
.watch{background:radial-gradient(900px 600px at 20% 0%,#ffb547 0%,#b8650a 50%,#4a2a06 100%)}
.pulse{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 10px rgba(255,255,255,.55);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 22px rgba(255,255,255,.12)}}
.eyebrow{font:800 18px/1 Manrope;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:68px;line-height:1.02;margin:16px 0 24px;letter-spacing:-1px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:18px;background:rgba(0,0,0,.24);border:2px solid rgba(255,255,255,.35);border-radius:22px;padding:18px 22px;font:800 30px/1.15 Manrope}
.step b{display:grid;place-items:center;min-width:52px;height:52px;border-radius:50%;background:#fff;color:#b3140b;font-size:26px}
.watch .step b{color:#8a4a05}
.side{display:flex;flex-direction:column;gap:16px;justify-content:center}
.call{display:grid;place-items:center;text-align:center;border-radius:30px;background:#fff;color:#b3140b;padding:26px 10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.call .n{font:800 110px/1 Manrope;letter-spacing:-3px}
.call .l{font:800 20px/1 Manrope;letter-spacing:.18em;text-transform:uppercase;margin-top:6px}
.watch .call{color:#8a4a05}
.meta{background:rgba(0,0,0,.25);border-radius:20px;padding:16px 18px;font:700 18px/1.4 Manrope}
.meta small{display:block;font:800 13px/1 Manrope;letter-spacing:.18em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.note{position:absolute;left:48px;bottom:16px;font:600 15px/1.3 Manrope;opacity:.8}
.wait{position:fixed;inset:0;display:grid;place-items:center;font:700 20px Manrope;color:#ffd7d2}
</style></head>
<body class="emergency">
<div class="wait" id="wait">Checking…</div>
<div class="pulse" id="pulse" hidden></div>
<main class="wrap" id="app" hidden>
  <section>
    <div class="eyebrow" id="eyebrow">⚠ Possible severe allergic reaction</div>
    <h1 id="title">Call 911 now.</h1>
    <div class="steps" id="steps"></div>
  </section>
  <aside class="side">
    <div class="call" id="call"><div class="n" id="callN">911</div><div class="l" id="callL">Call now</div></div>
    <div class="meta"><small>Who</small><span id="who">—</span></div>
    <div class="meta"><small>Known allergies</small><span id="allergies">—</span></div>
    <div class="meta"><small>Signs heard</small><span id="signs">—</span></div>
  </aside>
  <div class="note">Fixed safety script from Sous's deterministic rules. Not generated by AI. Not medical advice.</div>
</main>
<script>
(function () {
  var initialized = false;
  function post(m) { try { parent.postMessage(m, '*'); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function render(r) {
    var sc = (r && r.structuredContent) || {}, d = sc.data || {};
    var emergency = d.level === 'emergency';
    document.body.className = emergency ? 'emergency' : 'watch';
    document.getElementById('wait').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('pulse').hidden = !emergency;
    var who = d.member || 'them';
    document.getElementById('eyebrow').textContent = emergency ? '⚠ Possible severe allergic reaction' : '⚠ Possible allergic reaction';
    document.getElementById('title').textContent = emergency ? 'Call 911 now.' : 'Watch closely.';
    var steps = emergency
      ? ['Call 911 now.', 'If ' + esc(d.member || 'they') + (d.member ? ' has' : ' have') + ' a prescribed epinephrine auto-injector, use it as directed.', "Don't wait to see if it gets better."]
      : ['Stay with ' + esc(who) + ' and watch for changes.', 'Any swelling or trouble breathing: call 911 right away.', 'Keep the food packaging for the doctor.'];
    document.getElementById('steps').innerHTML = steps.map(function (s, i) { return '<div class="step"><b>' + (i + 1) + '</b><span>' + s + '</span></div>'; }).join('');
    document.getElementById('callN').textContent = emergency ? '911' : 'Watch';
    document.getElementById('callL').textContent = emergency ? 'Call now' : 'Call 911 if it worsens';
    document.getElementById('who').textContent = d.member || 'Not named';
    var ka = d.knownAllergies;
    document.getElementById('allergies').textContent = Array.isArray(ka) && ka.length ? ka.map(function (a) { return typeof a === 'string' ? a : (a.member ? a.member + ': ' : '') + (a.allergies || a.allergen || []).toString(); }).join(' · ') : '—';
    var sg = d.signs || {};
    var list = [].concat(sg.emergency || [], sg.watch || []);
    document.getElementById('signs').textContent = list.length ? list.join(', ') : '—';
  }
  addEventListener('message', function (e) {
    var m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.method === 'ui/notifications/tool-result') { render(m.params); return; }
    if (m.id === 1 && !initialized) { initialized = true; post({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }); }
  });
  post({ jsonrpc: '2.0', id: 1, method: 'ui/initialize', params: { appInfo: { name: 'sous-alert', version: '1' }, appCapabilities: {}, protocolVersion: '2026-01-26' } });
  addEventListener('load', function () { setTimeout(function () { if (parent === window) render({ structuredContent: { data: { level: 'emergency', member: 'Leo', knownAllergies: ['peanut'], signs: { emergency: ['lips swelling'], watch: [] } } } }); }, 50); });
})();
</script>
</body></html>
